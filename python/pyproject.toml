[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hgis"
version = "0.1.0"
description = "Read hGIS projects, layers and features from Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kyle Kreuter" }]

# No hard dependency on an HTTP library. CPython uses httpx, Pyodide uses the
# browser's XMLHttpRequest -- neither belongs in a list that both have to satisfy.
# See hgis.transport.
dependencies = []

[project.optional-dependencies]
# What CPython needs to reach a server at all. Pyodide brings its own transport.
http = ["httpx>=0.24"]
# What to_dataframe() needs. Everything else works without it.
dataframe = ["pandas>=1.5"]
# Geometries as shapely objects instead of GeoJSON dicts.
geometry = ["shapely>=2.0"]
dev = ["httpx>=0.24", "pandas>=1.5", "shapely>=2.0", "pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hgis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a running hGIS server; skipped when none answers",
]

# Written down rather than passed on the command line, so that `ruff check`
# gives everyone the same answer. Without this, whoever runs it with different
# flags gets a different count -- which is exactly what happened once.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
# conftest and the test helpers are part of this project, not third-party
# packages, even though the tests import them by bare name.
known-first-party = ["hgis", "conftest"]
